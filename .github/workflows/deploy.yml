# Deployt per SSH auf deinen Server:
#   - manuell (Actions -> Deploy -> Run workflow)
#   - bei Änderungen an diesem Repo
#   - automatisch, wenn frontend/backend ein neues Image gebaut haben (repository_dispatch)
#
# Benötigte Secrets in diesem Repo:
#   DEPLOY_HOST     z.B. 203.0.113.10
#   DEPLOY_USER     z.B. deploy
#   DEPLOY_SSH_KEY  privater SSH-Key
#   DEPLOY_PATH     z.B. /opt/webapp   (dort liegt ein Klon dieses Repos + .env)
name: Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [image-updated]
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Erst aktiv, wenn die Repo-Variable DEPLOY_ENABLED=true gesetzt ist
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            make pull
