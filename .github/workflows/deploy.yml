# Deploys to your server via SSH:
#   - manually (Actions -> Deploy -> Run workflow)
#   - on changes to this repo
#   - automatically when frontend/backend have built a new image (repository_dispatch)
#
# Required secrets in this repo:
#   DEPLOY_HOST     e.g. 203.0.113.10
#   DEPLOY_USER     e.g. deploy
#   DEPLOY_SSH_KEY  private SSH key
#   DEPLOY_PATH     e.g. /opt/webapp   (location of a clone of this repo + .env)
name: Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [image-updated]
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only active once the repo variable DEPLOY_ENABLED=true is set
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            make pull
