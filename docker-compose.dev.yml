# Local development: builds frontend & backend from the sibling folders
# instead of pulling images from the registry.
#
# Expected folder structure:
#   project/
#   ├── frontend/
#   ├── backend/
#   └── deployment/   <- run here: make dev
#
# Additionally, the DB is exposed on localhost:5432.

services:
  frontend:
    image: local/frontend:dev
    build:
      context: ../frontend

  backend:
    image: local/backend:dev
    build:
      context: ../backend

  db:
    ports:
      - "5432:5432"
